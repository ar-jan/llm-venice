[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_venice"]

[project]
name = "llm-venice"
version = "0.10.0"
description = "LLM plugin to access models available via the Venice API"
readme = "README.md"
authors = [{name = "Arjan Mossel"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "httpx2",
    "llm>=0.33",
    "pydantic>=2.11",
    "typing_extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/ar-jan/llm-venice"
Changelog = "https://github.com/ar-jan/llm-venice/releases"
Issues = "https://github.com/ar-jan/llm-venice/issues"
CI = "https://github.com/ar-jan/llm-venice/actions"

[project.entry-points.llm]
venice = "llm_venice"

[project.optional-dependencies]
test = [
    "build",
    "hatchling>=1.27",
    "installer",
    "httpx2-pytest>=2.0.0",
    "jsonschema",
    "pytest",
    "sqlite_utils",
]
dev = [
    "ruff>=0.14.8",
    "pyright",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks integration tests that call external APIs"
]
addopts = "-m 'not integration'"

[tool.uv]
managed = false

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "lf"

[tool.pyright]
strict = [
    "llm_venice/errors.py", "llm_venice/types.py", "llm_venice/params.py",
    "llm_venice/_catalog_state.py", "llm_venice/models/_common.py", "llm_venice/_options.py", "llm_venice/catalog.py", "llm_venice/client.py", "llm_venice/_logging.py", "llm_venice/results.py", "llm_venice/_endpoints.py", "llm_venice/_http.py",
]
include = [
    "llm_venice",
    "tests",
]
exclude = [
    ".venv",
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
]
defineConstant = { DEBUG = true }

reportMissingImports = "error"

pythonVersion = "3.10"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
