name: Test

on:
  push:
  pull_request:
  workflow_dispatch: # Allow manual triggering
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e '.[test,dev]'
      - name: Check formatting
        run: |
          ruff format --check .
      - name: Run lint
        run: |
          ruff check --output-format=github .
      - name: Run tests
        run: |
          pytest

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          # The lowest supported version (requires-python >= 3.10), so the
          # check guards the floor. [tool.pyright] pythonVersion matches it.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e '.[test,dev]'
      - name: Type check
        # --pythonpath is required: [tool.pyright] points at a .venv that only
        # exists locally, so without it pyright resolves no installed package.
        run: |
          pyright --pythonpath "$(command -v python)"

  test-integration: # Run only when requested manually
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install -e '.[test]'
      - name: Run integration tests
        env:
          LLM_VENICE_KEY: ${{ secrets.LLM_VENICE_KEY }}
        run: |
          pytest -m integration
